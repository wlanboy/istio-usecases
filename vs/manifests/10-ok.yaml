# Positivfall: kein Konflikt in der Konfiguration.
# Die zweite Route ist allgemeiner als die erste und steht korrekt danach,
# der Catch-All steht am Ende, alle Subsets sind definiert.
# Da keine Pods laufen, meldet nur DR-SUBSET-NOPODS die Subsets v1 und v2.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: ok-vs
spec:
  hosts:
    - ok-svc
  http:
    - name: canary-api
      match:
        - headers:
            x-canary:
              exact: "true"
          uri:
            prefix: /api
      route:
        - destination:
            host: ok-svc
            subset: v2
    - name: canary
      match:
        - headers:
            x-canary:
              exact: "true"
      route:
        - destination:
            host: ok-svc
            subset: v2
    - name: default
      route:
        - destination:
            host: ok-svc
            subset: v1
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: ok-dr
spec:
  host: ok-svc
  trafficPolicy:
    loadBalancer:
      simple: ROUND_ROBIN
  subsets:
    - name: v1
      labels:
        version: v1
    - name: v2
      labels:
        version: v2
---
# Services fuer alle Ziele (sonst VS-DEST-MISSING)
apiVersion: v1
kind: Service
metadata: {name: ok-svc}
spec: {selector: {app: ok-svc}, ports: [{name: http, port: 80}]}
