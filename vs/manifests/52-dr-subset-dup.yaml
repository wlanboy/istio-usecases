# DR-HOST-DUP + DR-SUBSET-DUP: Subset v1 ist in zwei DRs fuer denselben Host
# mit unterschiedlichen Labels definiert.
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: drsub-a
  namespace: vstest
spec:
  host: drsub-svc
  subsets:
    - name: v1
      labels:
        version: v1
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: drsub-b
  namespace: vstest
spec:
  host: drsub-svc
  subsets:
    - name: v1
      labels:
        version: v1-hotfix
