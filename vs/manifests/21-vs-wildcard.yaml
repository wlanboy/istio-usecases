# VS-HOST-WILDCARD: *.wild.internal ueberlagert api.wild.internal.
# Fuer api.wild.internal greifen nur die Routen von wild-specific,
# die Timeout-Regel aus wild-all gilt dort nicht.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: wild-all
spec:
  hosts:
    - "*.wild.internal"
  http:
    - timeout: 5s
      route:
        - destination:
            host: wild-backend
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: wild-specific
spec:
  hosts:
    - api.wild.internal
  http:
    - route:
        - destination:
            host: wild-api
---
# Services fuer alle Ziele (sonst VS-DEST-MISSING)
apiVersion: v1
kind: Service
metadata: {name: wild-backend}
spec: {selector: {app: wild-backend}, ports: [{name: http, port: 80}]}
---
apiVersion: v1
kind: Service
metadata: {name: wild-api}
spec: {selector: {app: wild-api}, ports: [{name: http, port: 80}]}
