# VS-ROUTE-SHADOWED: Catch-All-Route steht vor der Header-Route.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: route-catchall
spec:
  hosts:
    - catchall-svc
  http:
    - name: default
      route:
        - destination:
            host: catchall-svc
    - name: debug
      match:
        - headers:
            x-debug:
              exact: "1"
      route:
        - destination:
            host: catchall-debug
---
# Services fuer alle Ziele (sonst VS-DEST-MISSING)
apiVersion: v1
kind: Service
metadata: {name: catchall-svc}
spec: {selector: {app: catchall-svc}, ports: [{name: http, port: 80}]}
---
apiVersion: v1
kind: Service
metadata: {name: catchall-debug}
spec: {selector: {app: catchall-debug}, ports: [{name: http, port: 80}]}
