# VS-GW-MERGE + VS-GW-SHADOW: blog-main hat einen Catch-All, blog-admin eine
# /admin-Route fuer denselben Host am selben Gateway. Kommt blog-main im Merge
# zuerst, ist /admin nie erreichbar.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: blog-main
spec:
  hosts:
    - blog.vstest.local
  gateways:
    - vstest-gw
  http:
    - route:
        - destination:
            host: blog
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: blog-admin
spec:
  hosts:
    - blog.vstest.local
  gateways:
    - vstest-gw
  http:
    - match:
        - uri:
            prefix: /admin
      route:
        - destination:
            host: blog-admin
---
# Services fuer alle Ziele (sonst VS-DEST-MISSING)
apiVersion: v1
kind: Service
metadata: {name: blog}
spec: {selector: {app: blog}, ports: [{name: http, port: 80}]}
---
apiVersion: v1
kind: Service
metadata: {name: blog-admin}
spec: {selector: {app: blog-admin}, ports: [{name: http, port: 80}]}
