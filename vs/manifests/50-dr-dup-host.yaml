# DR-HOST-DUP: zwei DestinationRules fuer denselben Host (Kurzname + FQDN).
# Nur eine setzt eine trafficPolicy -> Warnung, Subsets werden gemerged.
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: drdup-a
  namespace: vstest
spec:
  host: drdup-svc
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 10
  subsets:
    - name: v1
      labels:
        version: v1
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: drdup-b
  namespace: vstest
spec:
  host: drdup-svc.vstest.svc.cluster.local
  subsets:
    - name: v2
      labels:
        version: v2
