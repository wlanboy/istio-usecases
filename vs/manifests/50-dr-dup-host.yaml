# DR-HOST-DUP: zwei DestinationRules fuer denselben Host.
# Nur eine setzt eine trafficPolicy -> Warnung, Subsets werden gemerged.
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: drdup-a
spec:
  host: drdup-svc
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 10
  subsets:
    - name: v1
      labels:
        version: v1
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: drdup-b
spec:
  host: drdup-svc
  subsets:
    - name: v2
      labels:
        version: v2
