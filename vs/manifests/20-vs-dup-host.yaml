# VS-HOST-DUP: drei VirtualServices fuer denselben Host am Sidecar (mesh).
# Kein Namespace im YAML, daher nur Kurznamen (ein FQDN wuerde den Namespace festlegen).
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: dup-a
spec:
  hosts:
    - dup-svc
  http:
    - match:
        - uri:
            prefix: /a
      route:
        - destination:
            host: dup-svc
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: dup-b
spec:
  hosts:
    - dup-svc
  http:
    - match:
        - uri:
            prefix: /b
      route:
        - destination:
            host: dup-svc
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: dup-c
spec:
  hosts:
    - dup-svc
  http:
    - route:
        - destination:
            host: dup-svc
