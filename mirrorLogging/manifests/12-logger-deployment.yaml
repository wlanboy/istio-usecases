apiVersion: apps/v1
kind: Deployment
metadata:
  name: logger
  namespace: ${NAMESPACE}
  labels:
    app: logger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logger
  template:
    metadata:
      labels:
        app: logger
    spec:
      containers:
        - name: logger
          image: python:3.12-alpine
          command: ["python3", "/app/logger.py"]
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: logger-script
              mountPath: /app/logger.py
              subPath: logger.py
      volumes:
        - name: logger-script
          configMap:
            name: logger-script
