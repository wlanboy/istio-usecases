# Test-Client MIT Sidecar: sein Traffic zu github.com wird vom Sidecar zum Egress Gateway umgeleitet.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: curl
  namespace: egress-demo
  labels:
    app: curl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: curl
  template:
    metadata:
      labels:
        app: curl
    spec:
      containers:
        - name: curl
          image: curlimages/curl:8.11.0
          command: ["/bin/sleep", "infinity"]
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
