apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: ovintegration-nginx
  namespace: ${NAMESPACE}
spec:
  hosts:
    - "*"
  gateways:
    - ovintegration-gateway
    # Zusaetzlich an das zentrale TLS-Gateway aus install-istio-passthrough.sh gebunden, damit
    # dieselbe App ueber beide Wege testbar ist: lokale Route/edge-TLS (Weg A, siehe run.sh) UND
    # zentrale Wildcard-Route/TLS-am-Envoy (Weg B). Existiert das Gateway nicht (nur install.sh
    # ohne install-istio-passthrough.sh ausgefuehrt), ist diese Referenz wirkungslos, kein Fehler.
    - istio-system/ovintegration-gateway-tls
  http:
    - route:
        - destination:
            host: nginx.${NAMESPACE}.svc.cluster.local
            port:
              number: 80
