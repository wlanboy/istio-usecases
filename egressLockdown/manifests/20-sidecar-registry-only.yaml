# Gilt fuer ALLE Workloads in ${NAMESPACE} ohne eigenen, spezifischeren
# Sidecar-Workload-Selector (kein workloadSelector gesetzt -> Namespace-weit).
apiVersion: networking.istio.io/v1beta1
kind: Sidecar
metadata:
  name: egress-lockdown
  namespace: ${NAMESPACE}
spec:
  outboundTrafficPolicy:
    # REGISTRY_ONLY statt (Standard) ALLOW_ANY: ausgehender Traffic wird nur
    # noch zu Hosts durchgelassen, die Istio in seiner Service-Registry kennt
    # - also andere Kubernetes-Services im Cluster (automatisch registriert)
    # oder explizit per ServiceEntry freigegebene externe Hosts. Jeder nicht
    # per ServiceEntry freigegebene Cluster-externe Host bleibt gesperrt -
    # der Envoy-Sidecar verwirft die Verbindung dafuer sofort ueber den
    # BlackHoleCluster, statt sie ins Internet durchzureichen. Die einzige
    # bewusste Ausnahme in diesem Namespace ist git.gmk.lan (Forgejo), siehe
    # manifests/21-serviceentry-forgejo.yaml.
    mode: REGISTRY_ONLY
