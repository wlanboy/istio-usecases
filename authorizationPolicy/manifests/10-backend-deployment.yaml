apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: ${NAMESPACE}
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # eigener ServiceAccount - seine Identity (Namespace + Name) landet als
      # SPIFFE-Principal im mTLS-Client-Zertifikat und wird von
      # AuthorizationPolicy-Regeln als source.principals ausgewertet
      serviceAccountName: backend
      containers:
        - name: nginx
          # unprivileged Image: lauscht bereits ohne weitere Konfiguration auf Port 8080
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
      volumes:
        - name: html
          configMap:
            name: backend-html
