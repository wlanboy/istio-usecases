# Zweiter Namespace, auf den der Test-ServiceAccount telepresence-dev keinerlei
# Rechte hat. Prueft, ob der traffic-manager Intercepts dort trotzdem erlaubt.
apiVersion: v1
kind: Namespace
metadata:
  name: telepresence-other
  labels:
    istio-injection: enabled
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: telepresence-other
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echo
  template:
    metadata:
      labels:
        app: echo
    spec:
      containers:
        - name: echo
          image: nginxinc/nginx-unprivileged:1.30-trixie
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: telepresence-other
spec:
  selector:
    app: echo
  ports:
    - name: http
      port: 80
      targetPort: 8080
