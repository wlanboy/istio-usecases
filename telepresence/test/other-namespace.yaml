# Zweiter Namespace, auf den der Test-ServiceAccount telepresence-dev keinerlei
# Rechte hat. Prueft, ob der traffic-manager Intercepts dort trotzdem erlaubt.
apiVersion: v1
kind: Namespace
metadata:
  name: telepresence-other
  labels:
    istio-injection: enabled
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: telepresence-other
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echo
  template:
    metadata:
      labels:
        app: echo
    spec:
      containers:
        - name: echo
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: telepresence-other
spec:
  selector:
    app: echo
  ports:
    - name: http
      port: 80
      targetPort: 80
