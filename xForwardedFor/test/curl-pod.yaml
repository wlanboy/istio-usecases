apiVersion: v1
kind: Pod
metadata:
  name: ${POD_NAME}
  namespace: ${NAMESPACE}
  labels:
    app: xff-curltest
  annotations:
    sidecar.istio.io/inject: "false"
spec:
  restartPolicy: Never
  containers:
    - name: curltest
      image: curlimages/curl:8.11.0
      resources:
        requests:
          cpu: 20m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
      command:
        - curl
        - -s
        - -H
        - "X-Forwarded-For: ${XFF_VALUE}"
        - "${TARGET}"
