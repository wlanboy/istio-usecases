apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wartung-client
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.targetRevision }}
    path: wartung/charts/client
    helm:
      releaseName: client
  destination:
    server: https://kubernetes.default.svc
    namespace: client
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
