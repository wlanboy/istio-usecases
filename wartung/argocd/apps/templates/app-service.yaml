apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wartung-service
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.targetRevision }}
    path: wartung/charts/service
    helm:
      releaseName: service
  destination:
    server: https://kubernetes.default.svc
    namespace: service
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
