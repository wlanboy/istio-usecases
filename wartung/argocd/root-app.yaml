# Root-App (App of Apps). Wird einmal per kubectl angelegt und rendert aus
# apps/ die Kind-Apps. Der Wartungsmodus ist ein Helm-Parameter an dieser App:
#   argocd app set wartung-root --helm-set wartung=true
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wartung-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/wlanboy/istio-usecases.git
    targetRevision: main
    path: wartung/argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
