apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.deploymentName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.deploymentName }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.deploymentName }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      # Istio erkennt den Port als HTTP -> VirtualService-HTTP-Routen greifen
      appProtocol: http
