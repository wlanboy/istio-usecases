apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: {{ .Values.deploymentName }}-gateway
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    {{- toYaml .Values.istio.gateway.selector | nindent 4 }}
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - {{ .Values.host }}
